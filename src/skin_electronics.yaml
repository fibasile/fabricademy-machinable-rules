unit: Skin Interfaces
unit_id: skin_electronics
version: 2027
date: "2026-12-01"
tasks:
  - name: Skin Interfaces
    description:
    outcomes:
      - "Research skills: the participant has acquired knowledge through references and concept development"
      - "Design skills: the participant learnt to program a microcontroller, design circuit and schematic OR has explored the world of bio-electronics and learnt to design a bio-sensor"
      - "Fabrication skills: the participant is able of integrating inputs and outputs in a microcontroller project OR is able to integrate bio-sensors in a wearable project to craft a wearable interface"
      - "Process skills: Anyone can go through the process, understand it and reproduce it"
      - "Final outcome: Is the assignment is assembled, functioning or tested"
      - "Originality: Has the design been thought through and elaborated?"
    checklist:
      - "Document the concept, sketches, references also to artistic and scientific publications"
      - "Design “wearable interfaces”, with either a bio-based reactive sensor (pH / temperature / etc) or using close to the skin electronics with a micro-controller"
      - "Document the project and included all source files and all materials used"
      - "Upload your design files and source code OR the detailed bio-recipe and process of sensing"
      - "Make a video with your skin electronic working"
faq: |
  Q: What can i do for extra points?
  A: Make a short performance/concept movie of your project functioning.
  Q: How is this different from wearables?
  A: For skin electronics the circuit should be a wearable placed on the skin (mask, hair, tattoo, patch, glove, nails)
  Q: Do I need to use a microcontroller?
  A: Yes, but you have options: you should either use a small microcontroller that can be hidden - such as ATtiny, gemma or any other alike and/or decide to work with bio-electronics and thoroughly document the functioning of your bio-sensor and integrate it as a skin interface into a project.
  Q: Can it be connected to a power supply or computer?
  A: Your wearables should be powered by battery to ensure wearability where possible.

