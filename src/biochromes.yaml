unit: Biochromes
unit_id: biochromes
version: 2027
date: "2026-10-06"
tasks:
  - name: Biochromes
    description:
    outcomes:
      - "Research skills: the participant has acquired knowledge through references and concept development"
      - "Technical skills: Master techniques mordanting, dyeing (botanical or bacterial), pigments "
      - "Process skills:  Anyone can go through the workflow and recipes, understand them and reproduce it"
      - "Final outcome: the participant understands various stages of color as: dye, inks and pigment"
      - "Originality: Has the research been thought through and elaborated?"
    checklist:
      - "Include some inspiration: research on artists or projects that on natural/bacterial dyeing, local ingedients and resources"
      - "Produce at least 1 natural dye with modifiers on fabric or yarn"
      - "Produce 1 ink (not just dye on a paper) OR 1 pigment (recycling the dye bath leftover or creating one from scratch"
      - "Document your recipes, the ingredients and process and if there have been changes from what was provided, document your unexpected discoveries"
      - "Submit some of your swatches or a catalogue of them to the analog material library of your lab (20cm x 20cm approx)"
faq: |
  Q: Can this assignment be done in group?
  A: Yes, but you need to document clearly your own experimentation with text and pictures. If you use your colleague’s picture, always credit them.
